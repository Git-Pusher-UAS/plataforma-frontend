name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela ejecuciones superadas por un commit más reciente de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos para el token
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Mismos comandos que se ejecutan en local: lint, tipos, pruebas, auditoría y tipos generados
      - run: make check
      - run: npm run build
