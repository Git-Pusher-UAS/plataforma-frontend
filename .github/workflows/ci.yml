name: CI

on:
  pull_request:
  push:
    branches: [main]

# Cancela ejecuciones superadas por un commit más reciente de la misma rama
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Permisos mínimos para el token
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Mismos comandos que se ejecutan en local: lint, tipos, pruebas, auditoría y tipos generados
      - run: make check
      - run: npm run build
